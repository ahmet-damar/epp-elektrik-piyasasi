# ============================================================================
# EPP CD — imaj build + GHCR + migration + self-host (SSH) · açık kaynak
# ADR-5: Tescilli PaaS yok; GHCR (ücretsiz) + Docker Compose self-host.
# ============================================================================
name: Deploy
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-push:
    name: Build & Push (GHCR)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: web, context: ./web }
          - { name: worker, context: ./worker }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: DB migrations (idempotent)
    runs-on: ubuntu-latest
    needs: [build-push]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Migration uygula (sıralı, ON_ERROR_STOP)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          for f in $(ls migrations/*.sql | sort); do
            echo ">> $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

  deploy-ssh:
    name: Deploy (self-host via SSH)
    runs-on: ubuntu-latest
    needs: [migrate]
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/epp
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

  smoke:
    name: Smoke test (health)
    runs-on: ubuntu-latest
    needs: [deploy-ssh]
    steps:
      - run: curl -fsS "${{ secrets.PROD_URL }}/api/health" || exit 1

  # ALTERNATİF (açık kaynak PaaS): deploy-ssh yerine Coolify webhook
