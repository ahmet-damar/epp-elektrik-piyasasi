# ============================================================================
# EPP CI — Python + Supabase local tooling validation
# ============================================================================
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  worker:
    name: Worker (lint · types · validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m ruff check app worker
      - run: python -m ruff format --check app worker
      - run: python -m mypy app worker --ignore-missing-imports --explicit-package-bases
      - run: python worker/validate_rls_static.py
      - run: python worker/dogrula.py
      - run: python -m compileall app worker data

  integration:
    name: Schema validation + static RLS validation
    runs-on: ubuntu-latest
    needs: [worker]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: epp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/epp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Apply base schema to test PostgreSQL
        run: psql "$DATABASE_URL" -f supabase/migrations/20260819_0001_init_schema.sql
      - name: Run static RLS validation
        run: python worker/validate_rls_static.py

  supabase-tooling:
    name: Supabase tooling (npm install + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  sql:
    name: SQL lint (migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install sqlfluff==3.3.0
      - run: python -m sqlfluff lint db supabase/migrations --dialect postgres

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [worker, integration, supabase-tooling, sql]
    steps:
      - run: echo "Tüm zorunlu kontroller geçti"
