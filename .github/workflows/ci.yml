# ============================================================================
# EPP CI — Python + Supabase local tooling validation
# ============================================================================
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  worker:
    name: Worker (lint · types · validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m ruff check app worker
      - run: python -m ruff format --check app worker
      - run: python -m mypy app worker --ignore-missing-imports --explicit-package-bases
      - run: python worker/validate_rls_static.py
      - run: python worker/dogrula.py
      - run: python -m pytest worker/tests -v
      - run: python -m compileall app worker data

  integration:
    name: Schema validation + static RLS validation
    runs-on: ubuntu-latest
    needs: [worker]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: epp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/epp_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Bootstrap Supabase-managed roles (anon/authenticated/service_role)
        # supabase/ci-only/ is NOT under supabase/migrations/, so deploy.yml never
        # applies it to real Supabase - it already has these roles there. Mimics
        # what `supabase start` sets up locally before any project migration runs.
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/ci-only/01_roles_bootstrap.sql
      - name: Apply 0001 (creates viewer/data_operator/admin roles, needed before the auth stub can grant to them)
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20260819_0001_init_schema.sql
      - name: Stub the auth schema (real Supabase Postgres has this; plain postgres:16 doesn't)
        # supabase/ci-only/ is NOT under supabase/migrations/, so deploy.yml never
        # applies it to real Supabase - it already has a real `auth` schema there,
        # already USAGE/EXECUTE-granted to every role. Runs AFTER 0001 so all 6
        # roles (anon/authenticated/service_role from the bootstrap step above,
        # viewer/data_operator/admin from 0001) exist for the stub's GRANTs.
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/ci-only/00_auth_stub.sql
      - name: Apply schema + RLS + dimension seed to test PostgreSQL
        # ALL migrations now apply here (2026-09-02) - the roles bootstrap step
        # above means 0003/0010/0011/0013 (anon/authenticated/service_role
        # grants) no longer need to be excluded for "role does not exist".
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20260819_0002_rls_roles.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20260819_0003_fix_grants.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20260819_0004_seed_dimensions.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20260819_0005_uretim_mwh_nullable.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20260819_0006_fact_serbest_tuketici_grain.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20260819_0007_dim_kaynak_motorin_nafta.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20260819_0008_dim_il_koordinat.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20260819_0009_fact_hava_aylik_upsert_model.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20260819_0010_fact_hava_aylik_log_supabase_grants.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20260819_0011_fact_hava_aylik_log_anon_revoke.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20260819_0012_veri_kapsam_disi.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20260819_0013_veri_kapsam_disi_authenticated_grants.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20260819_0014_current_app_role_viewer_grants.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20260819_0015_auth_schema_usage_viewer_grants.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20260819_0016_app_dashboard_service_role.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20260819_0017_restore_viewer_data_operator_admin_table_grants.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20260819_0018_current_app_role_security_definer.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20260819_0019_drop_undocumented_bypass_policies.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20260904_0001_dim_grants_fix.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20260904_0002_dim_rls_disable.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20260904_0003_missing_grants.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20260904_0004_sistem_kpi_job_rls_disable.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20260905_0001_kpi_esik_seed.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f supabase/migrations/20260905_0002_fact_tuketim_ulke_geneli.sql
      - name: Run static RLS validation
        run: python worker/validate_rls_static.py
      - name: Run role-based access verification (anon vs viewer, real RLS/GRANT behavior)
        run: python worker/validate_role_access.py
      - name: Run ingest pipeline integration tests (P0-4/P0-5)
        run: python -m pytest worker/tests/test_ingest_integration.py -v
      - name: Run orchestration integration tests (§4 Uçtan Uca Veri Akışı)
        run: python -m pytest worker/tests/test_pipeline_integration.py -v
      - name: Run Faz 1 async worker integration tests (job_status kuyruğu)
        run: python -m pytest worker/tests/test_job_worker_integration.py -v
      - name: Run Faz 2 analytics integration tests (dashboard sorguları)
        run: python -m pytest worker/tests/test_analytics_integration.py -v
      - name: Run Faz 3 fetch_weather integration tests (mocklu Open-Meteo)
        run: python -m pytest worker/tests/test_fetch_weather_integration.py -v

  supabase-tooling:
    name: Supabase tooling (npm install + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  sql:
    name: SQL lint (migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install sqlfluff==3.3.0
      - run: python -m sqlfluff lint db supabase/migrations supabase/ci-only --dialect postgres

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [worker, integration, supabase-tooling, sql]
    steps:
      - run: echo "Tüm zorunlu kontroller geçti"
