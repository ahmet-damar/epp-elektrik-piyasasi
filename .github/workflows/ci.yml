# ============================================================================
# EPP CI — test + lint + kalite kapıları (G-1..G-7) · GitHub Actions (ücretsiz)
# ============================================================================
name: CI
on:
  pull_request: { branches: [main] }
  push: { branches: [main] }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  # G-7: Web (TS) lint + tip + birim
  web:
    name: Web (lint · types · unit)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ./web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test -- --run --coverage

  # G-1, G-2, G-6: Python (lint+tip+birim+golden+model) & kapsam
  worker:
    name: Worker (lint · types · unit · golden)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ./worker } }
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }        # golden dosyalar
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      # birim + golden + veri kalite (P0-2 dahil) — %85 kapsam eşiği
      - run: pytest -m "not integration and not e2e" --cov=. --cov-report=xml --cov-fail-under=85

  # G-3, G-5: Entegrasyon + RLS (gerçek Postgres)
  integration:
    name: Integration + RLS (Postgres)
    runs-on: ubuntu-latest
    needs: [worker]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: epp_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/epp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -r worker/requirements.txt -r worker/requirements-dev.txt
      - name: Şema + migration uygula (source_asset, ingestion_batch, fact_*)
        run: psql "$DATABASE_URL" -f db/schema.sql
      - name: Entegrasyon + RLS testleri
        run: pytest -m "integration or rls" -v
        working-directory: ./worker

  # SQL migration lint
  sql:
    name: SQL lint (migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install sqlfluff==3.3.0
      - run: sqlfluff lint db migrations --dialect postgres

  # Kalite kapısı — branch protection'da "required check" olarak seç
  quality-gate:
    name: Quality Gate (G-1..G-7)
    runs-on: ubuntu-latest
    needs: [web, worker, integration, sql]
    steps:
      - run: echo "Tüm zorunlu kontroller geçti"
