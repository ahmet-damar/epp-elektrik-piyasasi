# ============================================================================
# EPP Scheduled Refresh — Open-Meteo hava verisi (source_kind='api')
# API kaynağı: source_uri + request_hash ile source_asset kaydı (P0-3).
# ============================================================================
name: Scheduled Refresh
on:
  schedule: [ { cron: "0 4 * * *" } ]   # her gün 04:00 UTC
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  refresh-weather:
    name: Open-Meteo hava verisi çek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Hava verisini çek (source_asset kind=api) ve DB'ye UPSERT et
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: python -m worker.jobs.fetch_weather --incremental
